global(workDirectory="/var/log/victim-lab/rsyslog-work" maxMessageSize="2k")

module(load="impstats"
       interval="5"
       format="json"
       log.syslog="off"
       log.file="/var/log/victim-lab/rsyslog-stats.log")
module(load="imudp")

template(name="LabJson" type="list") {
    constant(value="{\"timestamp_utc\":\"")
    property(name="timereported" dateFormat="rfc3339" date.inUTC="on" format="json")
    constant(value="\",\"source_ip\":\"")
    property(name="fromhost-ip" format="json")
    constant(value="\",\"hostname\":\"")
    property(name="hostname" format="json")
    constant(value="\",\"app\":\"")
    property(name="app-name" format="json")
    constant(value="\",\"severity\":\"")
    property(name="syslogseverity-text" format="json")
    constant(value="\",\"message\":\"")
    property(name="msg" format="json")
    constant(value="\"}\n")
}

ruleset(name="lab_remote") {
    action(type="omfile"
           name="lab_messages"
           file="/var/log/victim-lab/syslog.jsonl"
           template="LabJson"
           fileCreateMode="0640"
           rotation.sizeLimit="20971520"
           rotation.sizeLimitCommand="/opt/victim-lab/scripts/rotate_syslog.sh")
}

input(type="imudp" Address="10.20.0.2" port="514" name="lab_syslog" ruleset="lab_remote")
