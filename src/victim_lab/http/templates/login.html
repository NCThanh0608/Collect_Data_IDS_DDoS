<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Victim Lab | Đăng nhập</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="card"><div class="eyebrow">VICTIM LAB</div><h1>Đăng nhập</h1><p class="sub">Đăng nhập để truy cập trang quản trị mô phỏng.</p>{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}<form method="post" action="{{ url_for('login') }}"><label for="username">Tên đăng nhập</label><input id="username" name="username" autocomplete="username" required autofocus placeholder="Nhập username"><label for="password">Mật khẩu</label><input id="password" type="password" name="password" autocomplete="current-password" required placeholder="Nhập password"><button type="submit">Đăng nhập</button></form><div class="footer">HTTP Authentication Demo</div></main></body></html>
